[tool.poetry]
name = "moomotion"
version = "0.1.0"
description = "Moomotion is a project aiming to predict animal behavior using data from various sensors."
authors = ["leutrim-uka <leutrim.uka6@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = ">=2.2.3,<3.0.0"
scikit-learn = ">=1.6.1,<2.0.0"
numpy = ">=1.26.0,<3.0.0"
zenml = { version = "==0.80.0", extras = ["server"] }
click = "==8.1.3"
notebook = ">=7.3.2,<8.0.0"
black = ">=25.1.0,<26.0.0"
ruff = ">=0.9.9,<0.10.0"
openpyxl = ">=3.1.5,<4.0.0"
matplotlib = ">=3.10.1,<4.0.0"
seaborn = ">=0.13.2,<0.14.0"
pyarrow = ">=19.0.1,<20.0.0"
xgboost = ">=3.0.0,<4.0.0"
imbalanced-learn = ">=0.11,<0.13"
missingno = ">=0.5.2,<0.6.0"
shap = ">=0.47.1,<0.48.0"
tensorflow = ">=2.19.0,<3.0.0"
keras = ">=3.9.2,<4.0.0"
plotly = ">=6.0.1,<7.0.0"
torch = "^2.7.0"
hmmlearn = "^0.3.3"

[tool.ruff]
exclude = ["./notebooks"]

[tool.black]
exclude = "./notebooks"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
